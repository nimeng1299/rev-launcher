[workspace]
resolver = "2"
members = ["mclib", "launcher", "sharingan"]
default-members = ["launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mclib = { path = "mclib" }
anyhow = "1.0"
md5 = "=0.8.1"
optfield = "0.4.0"
uuid = "1"
serde = "1"
serde_json = "1"
smart-default = "0.7.1"
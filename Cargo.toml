[workspace]
resolver = "2"
members = ["mclib", "launcher", "sharingan"]
default-members = ["launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mclib = { path = "mclib" }
sharingan = {path = "sharingan"}

anyhow = "1.0"
atomig = "0.4.3"
atomic_float = "1"
hex = "0.4.3"
lockfree = "0.5.1"
md5 = "=0.8.1"
optfield = "0.4.0"
serde = "1"
serde_json = "1"
sha1 = "0.11.0"
smart-default = "0.7.1"
ureq = "3"
uuid = "1"